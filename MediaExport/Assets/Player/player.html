<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
        iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
</head>
<body>
    <!-- Embeds are framed from an https origin so a Referer is sent; YouTube rejects embeds without one (error 153). -->
    <iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <script>
        // A bridge to the app: the player's position goes out, seek/play/pause requests come in.
        const frame = document.getElementById('frame');
        const src = new URLSearchParams(location.search).get('src') ?? '';
        const post = message => window.chrome?.webview?.postMessage(message);
        let control = { seek() {}, play() {}, pause() {} };
        let last = '';

        function report(seconds, playing) {
            const next = `${seconds.toFixed(1)}|${playing}`;
            if (next !== last) {
                last = next;
                post({ type: 'time', seconds, playing });
            }
        }

        function load(script, ready) {
            const tag = document.createElement('script');
            tag.src = script;
            tag.onload = ready;
            document.head.appendChild(tag);
        }

        if (src.startsWith('https://www.youtube.com/')) {
            frame.src = `${src}&origin=${encodeURIComponent(location.origin)}`;
            window.onYouTubeIframeAPIReady = () => {
                const player = new YT.Player(frame, {
                    events: {
                        onReady() {
                            control = {
                                seek: seconds => player.seekTo(seconds, true),
                                play: () => player.playVideo(),
                                pause: () => player.pauseVideo()
                            };
                            setInterval(() => report(player.getCurrentTime() ?? 0, player.getPlayerState() === YT.PlayerState.PLAYING), 200);
                        }
                    }
                });
            };
            load('https://www.youtube.com/iframe_api');
        } else if (src.startsWith('https://w.soundcloud.com/')) {
            frame.src = src;
            load('https://w.soundcloud.com/player/api.js', () => {
                const widget = SC.Widget(frame);
                widget.bind(SC.Widget.Events.READY, () => {
                    control = {
                        seek: seconds => widget.seekTo(seconds * 1000),
                        play: () => widget.play(),
                        pause: () => widget.pause()
                    };
                });
                widget.bind(SC.Widget.Events.PLAY_PROGRESS, event => report(event.currentPosition / 1000, true));
                widget.bind(SC.Widget.Events.PAUSE, event => report(event.currentPosition / 1000, false));
                widget.bind(SC.Widget.Events.SEEK, event => report(event.currentPosition / 1000, false));
            });
        } else if (src.startsWith('https://')) {
            frame.src = src;
        }

        window.chrome?.webview?.addEventListener('message', event => {
            const message = event.data;
            if (message?.type === 'seek') control.seek(message.seconds);
            if (message?.type === 'play') control.play();
            if (message?.type === 'pause') control.pause();
        });
    </script>
</body>
</html>
