<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
        iframe { width: 100%; height: 100%; border: 0; border-radius: 8px; background: #000; }
    </style>
</head>
<body>
    <!-- Embeds are framed from an https origin so a Referer is sent; YouTube rejects embeds without one (error 153). -->
    <iframe allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <script>
        const src = new URLSearchParams(location.search).get('src');
        if (src?.startsWith('https://')) document.querySelector('iframe').src = src;
    </script>
</body>
</html>
